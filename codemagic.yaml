workflows:
  ios-simulator-appetize:
    name: iOS Simulator Build → Appetize
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "iosApp"
        APP_ID: "none"
      groups:
        - appetize_credentials

    scripts:
      - name: Fix Gradle permissions
        script: |
          chmod +x ./gradlew

      - name: Build KMP iOS Simulator Framework
        script: |
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Find shared framework
        script: |
          echo "Searching for shared.framework..."
          find . -name "shared.framework" -print

      - name: Build iOS app for simulator
        script: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            build

      - name: Check generated framework
        script: |
          echo "Searching for shared.framework..."
          find . -name "shared.framework" -print

      - name: Package .app for Appetize
        script: |
          cd "$CM_BUILD_DIR"

          APP_PATH=$(find build/DerivedData/Build/Products \
            -maxdepth 2 \
            -name "*.app" \
            -print -quit)

          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          cd "$(dirname "$APP_PATH")"

          zip -r "$CM_BUILD_DIR/app-simulator.zip" \
            "$(basename "$APP_PATH")"

      - name: Upload to Appetize
        script: |
          if [ "$APP_ID" = "none" ]; then
            RESPONSE=$(curl -s \
              -F "file=@$CM_BUILD_DIR/app-simulator.zip" \
              -F "platform=ios" \
              "https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps")
          else
            RESPONSE=$(curl -s \
              -F "file=@$CM_BUILD_DIR/app-simulator.zip" \
              -F "platform=ios" \
              "https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps/$APP_ID")
          fi

          echo "$RESPONSE"
          echo "$RESPONSE" > "$CM_BUILD_DIR/appetize_response.json"

    artifacts:
      - app-simulator.zip
      - appetize_response.json

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
