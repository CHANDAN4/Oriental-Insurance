workflows:
  ios-simulator-appetize:
    name: iOS Simulator Build → Appetize
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "iosApp"
        APP_ID: "none"   # set to your real Appetize app id once you have one
      groups:
        - appetize_credentials   # define APPETIZE_API_TOKEN as a secret in Codemagic UI

    scripts:
      - name: Fix gradlew permissions
        script: |
          cd $CM_BUILD_DIR
          chmod +x gradlew

      - name: Build iOS app for simulator
        script: |
          cd $CM_BUILD_DIR
          xcodebuild \
            -project "iosApp/iosApp.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Package .app for Appetize
        script: |
          cd $CM_BUILD_DIR
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -maxdepth 2 | head -n 1)
          echo "Found app at $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r $CM_BUILD_DIR/app-simulator.zip "$(basename "$APP_PATH")"

      - name: Upload to Appetize
        script: |
          if [ "$APP_ID" = "none" ]; then
            RESPONSE=$(curl -s -F "file=@$CM_BUILD_DIR/app-simulator.zip" \
              -F "platform=ios" \
              "https://\$APPETIZE_API_TOKEN@api.appetize.io/v1/apps")
          else
            RESPONSE=$(curl -s -F "file=@$CM_BUILD_DIR/app-simulator.zip" \
              -F "platform=ios" \
              "https://\$APPETIZE_API_TOKEN@api.appetize.io/v1/apps/$APP_ID")
          fi
          echo "$RESPONSE"
          echo "$RESPONSE" > $CM_BUILD_DIR/appetize_response.json

    artifacts:
      - app-simulator.zip
      - appetize_response.json

    publishing:
      email:
        recipients:
          - your-email@example.com   # replace with your email
        notify:
          success: true
          failure: true
