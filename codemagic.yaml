workflows:
  ios-simulator-appetize:
    name: iOS Simulator Build → Appetize
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"   # adjust to your project
        XCODE_SCHEME: "iosApp"
        APP_ID: "none"   # optional: existing Appetize app id, leave empty for first upload
      groups:
        - appetize_credentials   # define APPETIZE_API_TOKEN as a secret in Codemagic UI

    scripts:
      - name: Set up code signing (not needed for simulator, skip)
        script: |
          echo "Simulator build — no signing required"

          - name: Fix gradlew permissions
            script: |
            cd $CM_BUILD_DIR
            chmod +x gradlew

      - name: Build Kotlin Multiplatform shared framework
        script: |
          cd $CM_BUILD_DIR
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -Pkotlin.native.cocoapods.platform=iphonesimulator || \
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Install CocoaPods (if used)
        script: |
          cd $CM_BUILD_DIR/iosApp
          pod install || echo "No Podfile found, skipping"

      - name: Build iOS app for simulator
        script: |
         cd $CM_BUILD_DIR
         xcodebuild \
          -project "iosApp/iosApp.xcodeproj" \
          -scheme "$XCODE_SCHEME" \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath build/DerivedData \
          -destination 'generic/platform=iOS Simulator' \
          build
        
      - name: Package .app for Appetize
        script: |
          cd $CM_BUILD_DIR
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -maxdepth 2 | head -n 1)
          echo "Found app at $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r $CM_BUILD_DIR/app-simulator.zip "$(basename "$APP_PATH")"

      - name: Upload to Appetize
        script: |
          if [ -z "$APP_ID" ]; then
            RESPONSE=$(curl -s -F "file=@$CM_BUILD_DIR/app-simulator.zip" \
              -F "platform=ios" \
              "https://\$APPETIZE_API_TOKEN@api.appetize.io/v1/apps")
          else
            RESPONSE=$(curl -s -F "file=@$CM_BUILD_DIR/app-simulator.zip" \
              -F "platform=ios" \
              "https://\$APPETIZE_API_TOKEN@api.appetize.io/v1/apps/$APP_ID")
          fi
          echo "$RESPONSE"
          echo "$RESPONSE" > $CM_BUILD_DIR/appetize_response.json

    artifacts:
      - app-simulator.zip
      - appetize_response.json

    publishing:
      email:
        recipients:
          - your-email@example.com   # replace with your email
        notify:
          success: true
          failure: true
