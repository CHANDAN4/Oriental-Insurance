scripts:
  - name: Set up code signing (not needed for simulator, skip)
    script: |
      echo "Simulator build — no signing required"

  - name: Fix gradlew permissions
    script: |
      cd $CM_BUILD_DIR
      chmod +x gradlew

  - name: Build Kotlin Multiplatform shared framework
    script: |
      cd $CM_BUILD_DIR
      ./gradlew :shared:embedAndSignAppleFrameworkForXcode -Pkotlin.native.cocoapods.platform=iphonesimulator || \
      ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
